services:
  dehneshin-mongodb:
    image: mongo:7
    container_name: dehneshin-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: dehneshin_secret_1404
      MONGO_INITDB_DATABASE: dehneshin
    ports:
      - "27018:27017"
    volumes:
      - dehneshin_mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dehneshin-net

  dehneshin-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dehneshin-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:dehneshin_secret_1404@dehneshin-mongodb:27017/dehneshin?authSource=admin
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - ./server/uploads:/app/uploads
      - ./server/logs:/app/logs
      - /app/node_modules
    depends_on:
      dehneshin-mongodb:
        condition: service_healthy
    networks:
      - dehneshin-net

  dehneshin-frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: dehneshin-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - dehneshin-backend
    networks:
      - dehneshin-net

volumes:
  dehneshin_mongodb_data:

networks:
  dehneshin-net:
    driver: bridge