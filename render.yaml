services:
  - type: web
    name: dehneshin
    runtime: node
    plan: free
    rootDir: /
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        value: https://dehneshin.onrender.com
